name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nyaya_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Backend Dependencies & Tools
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt pytest pytest-asyncio pytest-cov ruff black

      - name: Run Black Code Formatter Check
        run: |
          black --check backend/ scripts/

      - name: Run Ruff Linter Check
        run: |
          ruff check backend/ scripts/

      - name: Run Database Ingestion for Full Test Corpus
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/nyaya_db
          REDIS_URL: redis://localhost:6379
          GEMINI_API_KEY: fake-test-gemini-key
        run: |
          python scripts/ingest_bns.py
          python scripts/ingest_schedule.py

      - name: Run Backend Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/nyaya_db
          REDIS_URL: redis://localhost:6379
          GEMINI_API_KEY: fake-test-gemini-key
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing

      - name: Build Frontend Application Bundle
        run: |
          cd frontend
          npm ci
          npm run build

  secret-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Build & Push Container Images (GHCR)
    needs: [lint-test, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO }}/backend:${{ github.sha }}
            ghcr.io/${{ steps.repo_name.outputs.REPO }}/backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO }}/frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo_name.outputs.REPO }}/frontend:latest

  trivy-scan:
    name: Trivy Container Vulnerability Scan
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ghcr.io/${{ steps.repo_name.outputs.REPO }}/backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Frontend Image
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ghcr.io/${{ steps.repo_name.outputs.REPO }}/frontend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
